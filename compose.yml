services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres_mirror:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  pgdog:
    image: ${PGDOG_IMAGE:-ghcr.io/pgdogdev/pgdog:v0.1.32}
    depends_on:
      postgres:
        condition: service_healthy
      postgres_mirror:
        condition: service_healthy
    working_dir: /etc/pgdog
    ports:
      - "6543:5432"
    volumes:
      - ./pgdog.toml:/etc/pgdog/pgdog.toml:ro
      - ./users.toml:/etc/pgdog/users.toml:ro

  php:
    build:
      context: .
      dockerfile: Dockerfile.php74
    depends_on:
      postgres:
        condition: service_healthy
      pgdog:
        condition: service_started
    working_dir: /app
    volumes:
      - ./:/app
